<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zzj876</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: black; position: relative;
  }
  #bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center;
    transition: filter 8s ease-in-out, background-color 4s ease, background-image 2s ease-in-out;
  }
  .container {
    padding: 30px; border-radius: 20px; text-align: center; z-index: 1;
    background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
    animation: fade 2s ease-in-out;
  }
  .avatars img {
    width: 100px; height: 100px; border-radius: 50%; margin: 10px; object-fit: cover; border: 3px solid white;
    transition: transform 0.5s ease-in-out;
  }
  .avatars img:hover { transform: scale(1.1); }
  #timer { font-size: 24px; margin-bottom: 20px; color: white; text-shadow: 0 0 10px rgba(0, 0, 0, 0.6); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; }}
</style>
</head>
<body>
<div id="bg"></div>
<div class="container">
  <div id="timer"></div>
  <div class="avatars">
    <img src="头像.jpg" alt="七七">
    <img src="是姬姬啊.jpg" alt="qwq">
  </div>
  <h2 style="color:white;">yyds2077 ♥️ 是姬姬啊</h2>
  <p style="color:white;">总之 我很喜欢你</p>
</div>

<script>
  const start = new Date("2024-04-02");
  const bg = document.getElementById("bg");
  const images = ["姬姬送的糖.jpg", "色色.jpg", "糖.jpg","111.jpg","222.jpg","222.jpg","444.jpg","555.jpg","666.jpg"];
  let index = 0;

  function updateTimer() {
    let now = new Date();
    let days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    document.getElementById("timer").innerText = `已经相识 ${days} 天`;
  }

  function switchImage() {
    // 先开始变灰和降低亮度
    bg.style.transition = "filter 4s ease-in-out";
    bg.style.filter = "grayscale(100%) brightness(0%)";  

    setTimeout(() => {
      // 切换到下一张图片时，背景颜色变回透明、亮度恢复正常
      index = (index + 1) % images.length;
      bg.style.transition = "background-image 2s ease-in-out, filter 4s ease-in-out";
      bg.style.backgroundImage = `url('${images[index]}')`;
      bg.style.filter = "grayscale(40%) brightness(100%) blur(10px)"; // 渐亮恢复清晰
    }, 4000);
  }

  // 初始化第一张背景图片
  bg.style.backgroundImage = `url('${images[0]}')`;
  updateTimer();
  setInterval(updateTimer, 1000);
  setInterval(switchImage, 12000);
</script>
</body>
</html>
